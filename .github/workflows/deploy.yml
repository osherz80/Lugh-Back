name: Deploy Backend to Oracle Cloud

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # שלב חדש: העתקת קובץ הקונפיגורציה של Nginx מהפרויקט לשרת ה-Backend
      - name: Copy Nginx Config to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nginx/api.lugh.site.conf"
          target: "~/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # --- התקנת Nginx אם הוא לא קיים ---
            if ! command -v nginx > /dev/null; then
              echo "Nginx not found, installing..."
              sudo apt update
              sudo apt install nginx -y
            fi

            # --- פתיחת Firewall פנימי (IPtables) ---
            sudo iptables -I INPUT 1 -p tcp --dport 80 -j ACCEPT
            sudo iptables -I INPUT 1 -p tcp --dport 443 -j ACCEPT
            sudo netfilter-persistent save || true

            # --- הגדרת Nginx ל-API ---
            echo "Configuring Nginx..."
            # וודא שהתיקייה קיימת והעתק את הקובץ
            sudo mkdir -p /etc/nginx/sites-available/
            sudo cp ~/nginx/api.lugh.site.conf /etc/nginx/sites-available/api.lugh.site
            # יצירת Symlink והסרת ברירת המחדל
            sudo ln -sf /etc/nginx/sites-available/api.lugh.site /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            # בדיקת תקינות וריסטארט
            sudo nginx -t
            sudo systemctl restart nginx

            # --- טיפול ב-Docker ---
            TARGET_DIR="~/Lugh-Back"

            if [ ! -d "$TARGET_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git $TARGET_DIR
            fi
            cd $TARGET_DIR

            git fetch origin development
            git reset --hard origin/development

            echo "Building Docker image..."
            docker build -t lugh-server-image .

            echo "Restarting container..."
            docker stop lugh-server-container || true
            docker rm lugh-server-container || true

            docker run -d \
              --name lugh-server-container \
              -p 5050:5050 \
              -e PORT=5050 \
              -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e DB_POOLER_HOST="${{ secrets.DB_POOLER_HOST }}" \
              -e DB_POOLER_PORT="${{ secrets.DB_POOLER_PORT }}" \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_PORT="${{ secrets.DB_PORT }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              --restart always \
              lugh-server-image
